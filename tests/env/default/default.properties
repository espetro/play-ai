# Gauge-TS Test Environment Configuration
# Default environment for running play-ai extension tests

# Browser Configuration
# Agent-browser will use these settings for test runs
browser.headless=false
browser.timeout=30000

# Extension Configuration
extension.path=apps/extension/.output/chrome-mv3
extension.id=play-ai-extension

# YouTube Test Configuration
# SOCS cookie file to bypass YouTube consent interstitial
youtube.cookies_file=scripts/youtube-cookies.json
youtube.test_video=https://www.youtube.com/watch?v=ypzNhwpmOD4
youtube.invidious_fallback=https://inv.nadeko.net/watch?v=FDXWH51IJBY

# API Configuration for Testing
# Mock or test API endpoints (optional, for isolated testing)
test.openai_endpoint=https://api.openai.com/v1
test.anthropic_endpoint=https://api.anthropic.com/v1
test.custom_endpoint=https://api.custom-llm.test/v1

# LLM Mock Configuration
# If true, mock LLM responses instead of calling real APIs
test.use_mock_llm=true
test.mock_llm_summary=This video covers React hooks and state management. [0:01:30] Introduction to the concept. [0:05:12] Deep dive into useState. [0:12:45] Advanced patterns with useEffect.

# Token Counting Configuration
test.default_model=Claude 3.5 Sonnet
test.transcript_mock_token_count=15000

# Video Configuration
test.video_duration=600
test.video_title=React Hooks Tutorial

# Test Report Configuration
report.dir=./test-reports
report.format=html,json
report.screenshots=true

# Logging
log.level=DEBUG
log.file=./test-logs/gauge.log
